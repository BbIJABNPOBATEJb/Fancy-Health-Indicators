plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

apply from: '../../common/shared.gradle'

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = rootProject.file("../../stand/${findProperty('play') ? 'play' : 'client'}-neoforge-26.3")
            programArguments.addAll('--username', 'FancyLab', '--width', '1280', '--height', '720')
            if (findProperty('join')) programArguments.addAll('--quickPlayMultiplayer', findProperty('join').toString())
            if (!findProperty('play')) jvmArguments.addAll('-Dfancyhealth.stand=1', "-Dfancyhealth.bridge=${findProperty('bridge') ?: 25653}".toString())
        }
    }
    mods {
        fancyhealth {
            sourceSet sourceSets.main
        }
        fancyhealthdev {
            sourceSet sourceSets.dev
        }
    }
}
